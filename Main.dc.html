<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&display=swap');
    body { margin: 0; }
    a { color: #d9b98a; } a:hover { color: #c7a877; }
  </style>
</helmet>

<div style="position: relative; width: 1080px; height: 566px; overflow: hidden; background: #26313f; font-family: 'Noto Serif TC', 'Songti TC', 'STSong', 'PMingLiU', 'Microsoft JhengHei', serif;">

  <!-- Real photo: misty sunrise loch (Unsplash / Jack Anstey) -->
  <img src="loch-sunrise.jpg" alt="晨曦湖景"
       style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;">

  <!-- Soft scrim: darken top (text zone) and a touch of the base, keep the lake clear -->
  <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(16,24,36,0.52) 0%, rgba(16,24,36,0.34) 24%, rgba(16,24,36,0.08) 44%, rgba(16,24,36,0) 60%, rgba(16,24,36,0.05) 80%, rgba(16,24,36,0.30) 100%);"></div>

  <!-- Quote (upper sky) -->
  <div style="position: absolute; top: 58px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 0 80px; box-sizing: border-box;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 15px; text-align: center; color: #fbfaf6; text-shadow: 0 2px 18px rgba(6,12,22,0.55), 0 1px 3px rgba(6,12,22,0.4);">
      <div style="font-size: 43px; font-weight: 600; letter-spacing: 4px; line-height: 1.4;">想要的東西要努力爭取</div>
      <div style="font-size: 43px; font-weight: 600; letter-spacing: 4px; line-height: 1.4;">拼盡全力享受過程</div>
      <div style="font-size: 43px; font-weight: 600; letter-spacing: 4px; line-height: 1.4;">在疲憊與成就感中前進</div>
    </div>
    <!-- Small sun divider -->
    <div style="display: flex; align-items: center; gap: 15px;">
      <div style="width: 52px; height: 1px; background: rgba(255,244,228,0.75);"></div>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="rgba(255,240,220,0.95)" stroke-width="1.4" stroke-linecap="round">
        <circle cx="12" cy="12" r="4.2"></circle>
        <path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.2 5.2l1.7 1.7M17.1 17.1l1.7 1.7M18.8 5.2l-1.7 1.7M6.9 17.1l-1.7 1.7"></path>
      </svg>
      <div style="width: 52px; height: 1px; background: rgba(255,244,228,0.75);"></div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
